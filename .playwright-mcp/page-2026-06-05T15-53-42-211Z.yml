              - heading "神经网络基础" [level=1] [ref=e682]
              - blockquote [ref=e683]:
                - paragraph [ref=e684]:
                  - text: 本讲义由
                  - strong [ref=e685]: 领域知识生成 Agent
                  - text: 基于你的学情画像生成，难度已适配为「初级」，并经
                  - strong [ref=e686]: 内容审核 Agent
                  - text: RAG 交叉校验（幻觉率 < 5%）。
              - heading "一、什么是神经网络" [level=2] [ref=e687]
              - paragraph [ref=e688]: 神经网络（Neural Network）是一种受生物神经系统启发的计算模型。它由大量**神经元（Neuron）**相互连接构成，通过调整连接权重来学习数据中的规律。
              - paragraph [ref=e689]: 一个神经元完成三步运算：
              - list [ref=e690]:
                - listitem [ref=e691]:
                  - text: 对输入做
                  - strong [ref=e692]: 加权求和
                - listitem [ref=e693]:
                  - text: 加上
                  - strong [ref=e694]: 偏置（bias）
                - listitem [ref=e695]:
                  - text: 经过
                  - strong [ref=e696]: 激活函数
                  - text: 输出
              - heading "二、前向传播" [level=2] [ref=e697]
              - paragraph [ref=e698]: 前向传播是数据从输入层流向输出层的过程。对单个神经元：
              - code [ref=e700]:
                - text: import numpy as np
                - text: "def neuron(inputs, weights, bias): # 1. 加权求和 + 偏置 z = np.dot(inputs, weights) + bias # 2. ReLU 激活 return np.maximum(0, z) x = np.array([0.5, 0.8, 0.2]) w = np.array([0.4, 0.7, 0.1])"
                - text: "print(neuron(x, w, bias=0.1)) # -> 0.88"
              - heading "三、常见激活函数" [level=2] [ref=e701]
              - list [ref=e702]:
                - listitem [ref=e703]:
                  - strong [ref=e704]: ReLU
                  - text: ：
                  - code [ref=e705]: max(0, x)
                  - text: ，计算快、缓解梯度消失，最常用
                - listitem [ref=e706]:
                  - strong [ref=e707]: Sigmoid
                  - text: ：将输出压缩到 (0, 1)，适合二分类输出层
                - listitem [ref=e708]:
                  - strong [ref=e709]: Tanh
                  - text: ：输出范围 (-1, 1)，零均值，收敛通常快于 Sigmoid
              - heading "四、反向传播与学习" [level=2] [ref=e710]
              - paragraph [ref=e711]:
                - text: 网络通过
                - strong [ref=e712]:
                  - text: 反向传播（Backpropagation）
                  - strong [ref=e713]: 计算损失对每个权重的梯度，再用
                  - text: 梯度下降
                - text: 更新权重：
              - paragraph [ref=e714]:
                - code [ref=e715]: w ← w − η · ∂L/∂w
              - paragraph [ref=e716]:
                - text: 其中
                - code [ref=e717]: η
                - text: 是学习率（learning rate）。多轮迭代后，网络逐步逼近最优参数。
              - blockquote [ref=e718]:
                - paragraph [ref=e719]:
                  - strong [ref=e720]: 小结
                  - text: ：神经元 → 前向传播 → 激活 → 反向传播更新权重，构成了神经网络学习的完整闭环。下一步建议学习「深度学习原理」。
