        - generic [ref=e556]:
          - heading "神经网络基础" [level=1] [ref=e557]
          - blockquote [ref=e558]:
            - paragraph [ref=e559]:
              - text: 本讲义由
              - strong [ref=e560]: 领域知识生成 Agent
              - text: 基于你的学情画像生成，难度已适配为「初级」，并经
              - strong [ref=e561]: 内容审核 Agent
              - text: RAG 交叉校验（幻觉率 < 5%）。
          - heading "一、什么是神经网络" [level=2] [ref=e562]
          - paragraph [ref=e563]: 神经网络（Neural Network）是一种受生物神经系统启发的计算模型。它由大量**神经元（Neuron）**相互连接构成，通过调整连接权重来学习数据中的规律。
          - paragraph [ref=e564]: 一个神经元完成三步运算：
          - list [ref=e565]:
            - listitem [ref=e566]:
              - text: 对输入做
              - strong [ref=e567]: 加权求和
            - listitem [ref=e568]:
              - text: 加上
              - strong [ref=e569]: 偏置（bias）
            - listitem [ref=e570]:
              - text: 经过
              - strong [ref=e571]: 激活函数
              - text: 输出
          - heading "二、前向传播" [level=2] [ref=e572]
          - paragraph [ref=e573]: 前向传播是数据从输入层流向输出层的过程。对单个神经元：
          - code [ref=e576]:
            - text: import numpy as np
            - text: "def neuron(inputs, weights, bias): # 1. 加权求和 + 偏置 z = np.dot(inputs, weights) + bias # 2. ReLU 激活 return np.maximum(0, z) x = np.array([0.5, 0.8, 0.2]) w = np.array([0.4, 0.7, 0.1])"
            - text: "print(neuron(x, w, bias=0.1)) # -> 0.88"
          - heading "三、常见激活函数" [level=2] [ref=e577]
          - list [ref=e578]:
            - listitem [ref=e579]:
              - strong [ref=e580]: ReLU
              - text: ：
              - code [ref=e581]: max(0, x)
              - text: ，计算快、缓解梯度消失，最常用
            - listitem [ref=e582]:
              - strong [ref=e583]: Sigmoid
              - text: ：将输出压缩到 (0, 1)，适合二分类输出层
            - listitem [ref=e584]:
              - strong [ref=e585]: Tanh
              - text: ：输出范围 (-1, 1)，零均值，收敛通常快于 Sigmoid
          - heading "四、反向传播与学习" [level=2] [ref=e586]
          - paragraph [ref=e587]:
            - text: 网络通过
            - strong [ref=e588]:
              - text: 反向传播（Backpropagation）
              - strong [ref=e589]: 计算损失对每个权重的梯度，再用
              - text: 梯度下降
            - text: 更新权重：
          - paragraph [ref=e590]:
            - code [ref=e591]: w ← w − η · ∂L/∂w
          - paragraph [ref=e592]:
            - text: 其中
            - code [ref=e593]: η
            - text: 是学习率（learning rate）。多轮迭代后，网络逐步逼近最优参数。
          - blockquote [ref=e594]:
            - paragraph [ref=e595]:
              - strong [ref=e596]: 小结
              - text: ：神经元 → 前向传播 → 激活 → 反向传播更新权重，构成了神经网络学习的完整闭环。下一步建议学习「深度学习原理」。