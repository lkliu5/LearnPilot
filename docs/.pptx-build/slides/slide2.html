<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#F2F1EA;}
body{width:720pt;height:405pt;font-family:Arial,Helvetica,sans-serif;
  background:#F2F1EA;color:#262A23;display:flex;flex-direction:column;padding:26pt 34pt 16pt;}
.kicker{font-size:11pt;letter-spacing:4pt;color:#C58940;font-weight:bold;}
h1{font-size:26pt;font-weight:bold;margin:5pt 0 6pt;}
.rule{height:3pt;width:54pt;background:#5B7F6E;margin-bottom:14pt;}
.bd{flex:1;display:flex;align-items:stretch;}
.col{flex:1;display:flex;flex-direction:column;}
.colhd{font-size:13pt;font-weight:bold;margin-bottom:9pt;}
.pain .colhd{color:#A6492F;}
.val .colhd{color:#46624F;}
.card{border-radius:9pt;padding:13pt 15pt;margin-bottom:11pt;flex:1;display:flex;flex-direction:column;justify-content:center;}
.pain .card{background:#FAF0EC;border:1pt solid #ECD3C8;border-left:5pt solid #C0612F;}
.val .card{background:#FAF9F4;border:1pt solid #D7E0DA;border-left:5pt solid #5B7F6E;}
.card h3{font-size:14pt;font-weight:bold;margin-bottom:4pt;}
.card p{font-size:11pt;color:#4C5247;line-height:1.45;}
.arrow{width:58pt;display:flex;align-items:center;justify-content:center;}
.arrow p{font-size:34pt;color:#C58940;font-weight:bold;}
.ft{display:flex;justify-content:space-between;margin-top:8pt;}
.ft p{font-size:8.5pt;color:#9aa094;}
</style>
</head>
<body>
  <p class="kicker">痛点 与 应用价值</p>
  <h1>千人一面 + AI 幻觉，两大痛点</h1>
  <div class="rule"></div>
  <div class="bd">
    <div class="col pain">
      <p class="colhd">传统在线学习的两大痛点</p>
      <div class="card"><h3>资源千人一面</h3><p>统一进度、统一内容，无法适配每个人的基础、节奏与薄弱点。</p></div>
      <div class="card"><h3>AI 生成不可信</h3><p>大模型直接生成易"一本正经地胡说"，内容无法溯源、难以采信。</p></div>
    </div>
    <div class="arrow"><p>&rarr;</p></div>
    <div class="col val">
      <p class="colhd">智学中枢的价值主张</p>
      <div class="card"><h3>因材施教</h3><p>对话式画像 + 多智能体规划，按真实掌握度生成个性化资源与路径。</p></div>
      <div class="card"><h3>可信生成</h3><p>RAG 逐句接地校验 + 内容安全过滤，幻觉率压至 5% 以下、句句可溯源。</p></div>
    </div>
  </div>
  <div class="ft"><p>智学中枢 · 多智能体个性化学习平台</p><p>02 / 12</p></div>
</body>
</html>
