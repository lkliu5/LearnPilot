<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#F2F1EA;}
body{width:720pt;height:405pt;font-family:Arial,Helvetica,sans-serif;
  background:#F2F1EA;color:#262A23;display:flex;flex-direction:column;padding:24pt 34pt 14pt;}
.kicker{font-size:11pt;letter-spacing:4pt;color:#C58940;font-weight:bold;}
h1{font-size:25pt;font-weight:bold;margin:4pt 0 5pt;}
.rule{height:3pt;width:54pt;background:#5B7F6E;margin-bottom:14pt;}
.bd{flex:1;display:flex;flex-direction:column;justify-content:center;}
.cyc{display:flex;align-items:stretch;}
.stage{flex:1;background:#FAF9F4;border:1pt solid #DEDCD0;border-radius:10pt;padding:13pt 12pt;text-align:center;display:flex;flex-direction:column;}
.stage .ch{font-size:30pt;font-weight:bold;color:#5B7F6E;line-height:1;}
.stage h3{font-size:13pt;font-weight:bold;margin:6pt 0 4pt;}
.stage p{font-size:9.5pt;color:#4C5247;line-height:1.4;}
.cnar{display:flex;align-items:center;}
.cnar p{font-size:18pt;color:#C58940;font-weight:bold;margin:0 8pt;}
.loopband{background:#46624F;border-radius:9pt;padding:11pt 16pt;margin-top:16pt;display:flex;align-items:center;justify-content:center;}
.loopband p{font-size:12pt;color:#FFFFFF;font-weight:bold;}
.loopband b{color:#E0A458;}
.ft{display:flex;justify-content:space-between;margin-top:10pt;}
.ft p{font-size:8.5pt;color:#9aa094;}
</style>
</head>
<body>
  <p class="kicker">学 习 方 法 闭 环</p>
  <h1>学 — 记 — 讲 — 测，通关才算掌握</h1>
  <div class="rule"></div>
  <div class="bd">
    <div class="cyc">
      <div class="stage"><p class="ch">学</p><h3>资源精读</h3><p>个性化讲义 + 多模态资源</p></div>
      <div class="cnar"><p>&rarr;</p></div>
      <div class="stage"><p class="ch">记</p><h3>康奈尔笔记</h3><p>三栏结构化输入与回顾</p></div>
      <div class="cnar"><p>&rarr;</p></div>
      <div class="stage"><p class="ch">讲</p><h3>费曼讲解</h3><p>向 AI 讲，倒逼暴露知识缺口</p></div>
      <div class="cnar"><p>&rarr;</p></div>
      <div class="stage"><p class="ch">测</p><h3>阶段测试</h3><p>通关点亮"已掌握"</p></div>
    </div>
    <div class="loopband"><p>↻ &nbsp;未通关则回到薄弱点循环巩固 —— 一条 <b>科学学习闭环</b>，真正落地因材施教</p></div>
  </div>
  <div class="ft"><p>智学中枢 · 多智能体个性化学习平台</p><p>09 / 12</p></div>
</body>
</html>
