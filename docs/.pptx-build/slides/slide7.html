<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#F2F1EA;}
body{width:720pt;height:405pt;font-family:Arial,Helvetica,sans-serif;
  background:#F2F1EA;color:#262A23;display:flex;flex-direction:column;padding:24pt 34pt 14pt;}
.kicker{font-size:11pt;letter-spacing:4pt;color:#C58940;font-weight:bold;}
.kicker span{color:#5B7F6E;}
h1{font-size:25pt;font-weight:bold;margin:4pt 0 5pt;}
.rule{height:3pt;width:54pt;background:#5B7F6E;margin-bottom:12pt;}
.bd{flex:1;display:flex;}
.panel{flex:1;background:#FAF9F4;border:1pt solid #DEDCD0;border-radius:10pt;padding:14pt 16pt;display:flex;flex-direction:column;}
.panel:first-child{margin-right:16pt;border-top:5pt solid #5B7F6E;}
.panel:last-child{border-top:5pt solid #C58940;}
.pnum{font-size:10pt;letter-spacing:2pt;font-weight:bold;}
.p1 .pnum{color:#5B7F6E;}.p2 .pnum{color:#C58940;}
.panel h2{font-size:17pt;font-weight:bold;margin:3pt 0 9pt;}
.steps{display:flex;align-items:center;margin-bottom:11pt;flex-wrap:wrap;}
.sb{background:#EDEBE0;border-radius:6pt;padding:5pt 9pt;margin:2pt 0;}
.sb p{font-size:9.5pt;color:#46624F;font-weight:bold;}
.snar{color:#C58940;font-size:12pt;font-weight:bold;margin:0 5pt;}
.panel ul{padding-left:15pt;margin-bottom:10pt;}
.panel li{font-size:10.5pt;color:#4C5247;line-height:1.45;margin-bottom:4pt;}
.shot{flex:1;border:1.5pt dashed #B9B6A8;background:#EAE8DD;border-radius:8pt;display:flex;align-items:center;justify-content:center;min-height:46pt;}
.shot p{font-size:9.5pt;color:#8A8F82;}
.ft{display:flex;justify-content:space-between;margin-top:8pt;}
.ft p{font-size:8.5pt;color:#9aa094;}
</style>
</head>
<body>
  <p class="kicker">核心功能 4 / 5 &nbsp;<span>智能辅导 · 学习评估</span></p>
  <h1>哪里不懂补哪里，全程被看见</h1>
  <div class="rule"></div>
  <div class="bd">
    <div class="panel p1">
      <p class="pnum">04 &nbsp;智能辅导</p>
      <h2>按需资源生成</h2>
      <div class="steps">
        <div class="sb"><p>"我没懂"</p></div><span class="snar">&rarr;</span>
        <div class="sb"><p>识别问题点</p></div><span class="snar">&rarr;</span>
        <div class="sb"><p>资源清单</p></div><span class="snar">&rarr;</span>
        <div class="sb"><p>勾选即生成</p></div>
      </div>
      <ul>
        <li>自动定位卡点知识，给出针对性资源清单</li>
        <li>按需勾选，复用同源生成管线即时产出</li>
      </ul>
      <div class="shot"><p>〔此处放 智能辅导·资源清单 截图〕</p></div>
    </div>
    <div class="panel p2">
      <p class="pnum">05 &nbsp;学习评估</p>
      <h2>多维过程评估</h2>
      <div class="steps">
        <div class="sb"><p>真实做题行为</p></div><span class="snar">&rarr;</span>
        <div class="sb"><p>评估 Agent</p></div><span class="snar">&rarr;</span>
        <div class="sb"><p>动态调整建议</p></div>
      </div>
      <ul>
        <li>基于真实行为数据的多维度学情评估</li>
        <li>学情概览面板 + 动态调整学习建议</li>
      </ul>
      <div class="shot"><p>〔此处放 学情概览面板 截图〕</p></div>
    </div>
  </div>
  <div class="ft"><p>智学中枢 · 多智能体个性化学习平台</p><p>07 / 12</p></div>
</body>
</html>
