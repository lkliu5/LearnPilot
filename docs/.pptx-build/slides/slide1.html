<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#12161B;}
body{width:720pt;height:405pt;font-family:Arial,Helvetica,sans-serif;
  background:#12161B;color:#E7ECEA;display:flex;flex-direction:column;
  justify-content:space-between;padding:44pt 52pt;}
.kicker{font-size:12pt;letter-spacing:5pt;color:#6FB3A6;font-weight:bold;}
h1{font-size:62pt;color:#FFFFFF;font-weight:bold;letter-spacing:2pt;margin:10pt 0 6pt;}
.sub{font-size:21pt;color:#CBE3DC;font-weight:bold;}
.goldrule{height:3pt;width:90pt;background:#E0A458;margin:14pt 0 12pt;}
.pos{font-size:14pt;color:#9AA7A2;}
.chips{display:flex;}
.chip{background:#1F2730;border:1pt solid #33414C;border-radius:20pt;padding:7pt 16pt;margin-right:12pt;}
.chip p{font-size:11.5pt;color:#CBE3DC;font-weight:bold;}
.foot{display:flex;justify-content:space-between;align-items:flex-end;}
.foot p{font-size:10pt;color:#7E8C92;}
.team{font-size:11pt;color:#E0A458;font-weight:bold;}
</style>
</head>
<body>
  <div>
    <p class="kicker">多智能体 · 个性化学习 · 可信生成</p>
    <h1>智学中枢</h1>
    <p class="sub">多智能体驱动的个性化学习平台</p>
    <div class="goldrule"></div>
    <p class="pos">让 AI 真正因材施教 —— 让每一份学习内容都可溯源、可信</p>
  </div>
  <div class="chips">
    <div class="chip"><p>对话式画像</p></div>
    <div class="chip"><p>真实多智能体协同</p></div>
    <div class="chip"><p>防幻觉 &lt; 5%</p></div>
    <div class="chip"><p>学习方法闭环</p></div>
  </div>
  <div class="foot">
    <div>
      <p class="team">〔队伍名称 · 成员信息〕</p>
      <p>React + FastAPI + LangGraph + Chroma + RAG · 推理模型 DeepSeek</p>
    </div>
    <p>中国软件杯 · 参赛作品</p>
  </div>
</body>
</html>
