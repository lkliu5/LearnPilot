<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#F2F1EA;}
body{width:720pt;height:405pt;font-family:Arial,Helvetica,sans-serif;
  background:#F2F1EA;color:#262A23;display:flex;flex-direction:column;padding:22pt 34pt 12pt;}
.kicker{font-size:11pt;letter-spacing:4pt;color:#C58940;font-weight:bold;}
h1{font-size:24pt;font-weight:bold;margin:4pt 0 4pt;}
.rule{height:3pt;width:54pt;background:#5B7F6E;margin-bottom:10pt;}
.tiles{display:flex;margin-bottom:11pt;}
.tile{flex:1;background:#FAF9F4;border:1pt solid #DEDCD0;border-radius:10pt;padding:11pt 14pt;margin-right:11pt;}
.tile:last-child{margin-right:0;}
.tile .big{font-size:38pt;font-weight:bold;line-height:1;}
.t1 .big{color:#46624F;}.t2 .big{color:#5B7F6E;}.t3 .big{color:#C58940;}
.tile .lab{font-size:10.5pt;color:#33392F;font-weight:bold;margin-top:5pt;}
.tile .sub{font-size:8.5pt;color:#8A8F82;margin-top:2pt;}
.bd{flex:1;display:flex;}
.left{width:226pt;margin-right:14pt;display:flex;flex-direction:column;}
.left h4{font-size:11pt;color:#46624F;font-weight:bold;margin-bottom:6pt;}
.pipe{display:flex;flex-wrap:wrap;margin-bottom:9pt;}
.pp{background:#EDEBE0;border-radius:6pt;padding:5pt 9pt;margin:2pt 4pt 2pt 0;}
.pp p{font-size:9.5pt;color:#46624F;font-weight:bold;}
.perf{background:#FAF9F4;border:1pt solid #DEDCD0;border-radius:8pt;padding:9pt 12pt;}
.perf p{font-size:10pt;color:#4C5247;line-height:1.6;}
.perf b{color:#46624F;}
.chart{flex:1;background:#FAF9F4;border:1pt solid #DEDCD0;border-radius:8pt;}
.ft{display:flex;justify-content:space-between;margin-top:6pt;}
.ft p{font-size:8.5pt;color:#9aa094;}
</style>
</head>
<body>
  <p class="kicker">技 术 亮 点 与 真 实 指 标</p>
  <h1>RAG 接地，把幻觉摁到 5% 以下</h1>
  <div class="rule"></div>
  <div class="tiles">
    <div class="tile t1"><p class="big">4.28%</p><p class="lab">幻觉率</p><p class="sub">目标 &lt;5%　18 份讲义逐句接地</p></div>
    <div class="tile t2"><p class="big">100%</p><p class="lab">难度适配率</p><p class="sub">目标 ≥85%　三档难度区分</p></div>
    <div class="tile t3"><p class="big">100%</p><p class="lab">知识覆盖率</p><p class="sub">目标 ≥90%　36 项核心概念</p></div>
  </div>
  <div class="bd">
    <div class="left">
      <h4>RAG 生成管线</h4>
      <div class="pipe">
        <div class="pp"><p>画像</p></div>
        <div class="pp"><p>检索 153 切片</p></div>
        <div class="pp"><p>生成</p></div>
        <div class="pp"><p>逐句接地</p></div>
        <div class="pp"><p>重试/降级</p></div>
      </div>
      <div class="perf"><p><b>性能：</b>端到端 P50 13.2s / P90 37.0s<br><b>成本：</b>≈ ¥0.0197 / 份（DeepSeek 估算）<br><b>可靠：</b>327 条真实工作流轨迹统计</p></div>
    </div>
    <div class="chart placeholder" id="ablation"></div>
  </div>
  <div class="ft"><p>智学中枢 · 多智能体个性化学习平台</p><p>10 / 12</p></div>
</body>
</html>
