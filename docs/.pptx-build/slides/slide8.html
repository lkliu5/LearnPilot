<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#F2F1EA;}
body{width:720pt;height:405pt;font-family:Arial,Helvetica,sans-serif;
  background:#F2F1EA;color:#262A23;display:flex;flex-direction:column;padding:24pt 34pt 14pt;}
.kicker{font-size:11pt;letter-spacing:4pt;color:#C58940;font-weight:bold;}
h1{font-size:25pt;font-weight:bold;margin:4pt 0 5pt;}
.rule{height:3pt;width:54pt;background:#5B7F6E;margin-bottom:12pt;}
.grid{flex:1;display:flex;flex-wrap:wrap;align-content:space-between;}
.card{width:48.5%;background:#FAF9F4;border:1pt solid #DEDCD0;border-radius:10pt;padding:13pt 16pt;display:flex;}
.num{width:40pt;}
.num p{font-size:34pt;font-weight:bold;color:#E6DACB;line-height:1;}
.txt{flex:1;}
.txt h3{font-size:15pt;font-weight:bold;color:#46624F;margin-bottom:4pt;}
.txt p{font-size:10.5pt;color:#4C5247;line-height:1.45;}
.c1{border-left:5pt solid #5B7F6E;}
.c2{border-left:5pt solid #C58940;}
.c3{border-left:5pt solid #6FB3A6;}
.c4{border-left:5pt solid #46624F;}
.ft{display:flex;justify-content:space-between;margin-top:8pt;}
.ft p{font-size:8.5pt;color:#9aa094;}
</style>
</head>
<body>
  <p class="kicker">创 新 亮 点</p>
  <h1>四个让评委记得住的差异化</h1>
  <div class="rule"></div>
  <div class="grid">
    <div class="card c1"><div class="num"><p>1</p></div><div class="txt"><h3>真实多智能体协同</h3><p>LangGraph 五节点带回环重试，是真协同，非串行模拟的"伪多智能体"。</p></div></div>
    <div class="card c2"><div class="num"><p>2</p></div><div class="txt"><h3>防幻觉 + 内容安全 双保险</h3><p>逐句接地校验事实性 + 集中式内容安全过滤违规，两道关正交互补。</p></div></div>
    <div class="card c3"><div class="num"><p>3</p></div><div class="txt"><h3>费曼 + 康奈尔 学习闭环</h3><p>把科学学习方法做进产品："学—记—讲—测"通关才算掌握。</p></div></div>
    <div class="card c4"><div class="num"><p>4</p></div><div class="txt"><h3>对话式画像</h3><p>摒弃表单，自然交流构建 6 异质维度画像，不确定的标低置信不编造。</p></div></div>
  </div>
  <div class="ft"><p>智学中枢 · 多智能体个性化学习平台</p><p>08 / 12</p></div>
</body>
</html>
